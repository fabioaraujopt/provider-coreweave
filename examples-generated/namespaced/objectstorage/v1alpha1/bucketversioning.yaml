apiVersion: objectstorage.coreweave.m.crossplane.io/v1alpha1
kind: BucketVersioning
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1alpha1/bucketversioning
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    versioningConfiguration:
    - status: Enabled

---

apiVersion: objectstorage.coreweave.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1alpha1/bucketversioning
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    zone: US-EAST-04A
