apiVersion: objectstorage.coreweave.m.crossplane.io/v1alpha1
kind: AccessKey
metadata:
  name: example
  namespace: default
spec:
  forProvider:
    # 0 = permanent key; a positive number of seconds makes it expire.
    durationSeconds: 0
    attributes:
      application: crossplane-example
  # access_key_id and secret_access_key land in this Secret.
  writeConnectionSecretToRef:
    name: example-object-storage-key
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
