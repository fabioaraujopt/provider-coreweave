name: Publish Provider Package

# Builds the provider package for linux/amd64 and linux/arm64, pushes it to
# ghcr.io/<repository owner>/provider-coreweave, signs it (keyless cosign),
# attaches SLSA build provenance and an SPDX SBOM as GitHub attestations, and
# creates the GitHub release. See docs/RELEASING.md.
#
# Runs when a version tag is pushed, or manually from the tag
# ("Use workflow from" -> Tags -> vX.Y.Z). Tags created by the Tag workflow
# don't trigger other workflows (GitHub never chains GITHUB_TOKEN events), so
# after using the Tag workflow, run this one manually.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Must equal the tag this workflow runs from (e.g. v0.1.0, v0.2.0-rc.1)."
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ env.VERSION }}
      go-version: ${{ steps.go.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check that the workflow runs from the release tag
        if: github.ref != format('refs/tags/{0}', env.VERSION)
        run: |
          echo "::error::Run this workflow from the ${VERSION} tag (Use workflow from -> Tags), not ${GITHUB_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Compute the image reference
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/provider-coreweave" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@451c4dc6ad3691b0a702a997a0ac24e8bbc8bbaa # main
    with:
      repository: provider-coreweave
      version: ${{ needs.prepare.outputs.version }}
      go-version: ${{ needs.prepare.outputs.go-version }}
      cleanup-disk: true
      registry_org: ${{ github.repository_owner }}
      mirror: false
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}

  sign-and-attest:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the package digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '/^Digest:/{print $2}')
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign the package
        run: cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.digest }}"

      - name: Generate the SBOM
        run: ${{ steps.syft.outputs.cmd }} "${IMAGE}@${{ steps.digest.outputs.digest }}" -o spdx-json=sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    needs:
      - prepare
      - sign-and-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      DIGEST: ${{ needs.sign-and-attest.outputs.digest }}
      REPO: ${{ github.repository }}
    steps:
      - name: Write the release header
        run: |
          cat > notes.md <<EOF
          ## Install

          \`\`\`yaml
          apiVersion: pkg.crossplane.io/v1
          kind: Provider
          metadata:
            name: provider-coreweave
          spec:
            package: ${IMAGE}:${VERSION}
          \`\`\`

          Package digest: \`${DIGEST}\`

          ## Verify

          \`\`\`bash
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPO}/\.github/workflows/publish-provider-package\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${REPO}
          \`\`\`

          EOF
          cat notes.md

      - name: Create or update the GitHub release
        run: |
          if gh release view "${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
            # A maintainer drafted the release already; keep their notes.
            gh release view "${VERSION}" --repo "${REPO}" --json body -q .body >> notes.md
            gh release edit "${VERSION}" --repo "${REPO}" --notes-file notes.md
          else
            prerelease=()
            if [[ "${VERSION}" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "${VERSION}" --repo "${REPO}" --verify-tag \
              --title "${VERSION}" --notes-file notes.md --generate-notes "${prerelease[@]}"
          fi
